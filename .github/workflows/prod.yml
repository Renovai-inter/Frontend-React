name: Pipeline PROD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Lint, build e artefato (PROD)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar lint
        run: npm run lint

      - name: Gerar build de produção
        run: npm run build

      - name: Publicar artefato de produção
        uses: actions/upload-artifact@v4
        with:
          name: frontend-prod-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
