name: Pipeline QA

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint e build (QA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar lint
        run: npm run lint

      - name: Gerar build de QA
        run: npm run build

      - name: Publicar artefato de QA
        uses: actions/upload-artifact@v4
        with:
          name: frontend-qa-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
