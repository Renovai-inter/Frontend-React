<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo_renovai.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@100;200;300;400;500;600;700" rel="stylesheet">
    <title>Renovaí</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- VLibras: tradução do conteúdo para Libras (plugin do governo federal) -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      window.addEventListener("load", function () {
        if (window.VLibras) new window.VLibras.Widget("https://vlibras.gov.br/app");
      });
    </script>
  </body>
</html>
